name: CrossMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    tags:
      - v*

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Get version
        run: |
          TAG="${{ github.ref_name }}"
          echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV
      - name: Install 7-Zip
        run: |
          mkdir -p /home/runner/work/CrossMix-OS/tools
          wget https://www.7-zip.org/a/7z2501-linux-x64.tar.xz -P /home/runner/work/CrossMix-OS/tools
          tar xvf /home/runner/work/CrossMix-OS/tools/7z2501-linux-x64.tar.xz -C /home/runner/work/CrossMix-OS/tools
          sudo cp /home/runner/work/CrossMix-OS/tools/7zz /usr/local/bin/
      - name: Extract RetroArch cores
        run: |
          find /home/runner/work/CrossMix-OS/CrossMix-OS/RetroArch/.retroarch/cores -name "*.7z" -execdir 7zz x {} \; -execdir rm {} \;
      - name: Cleaning image...
        run: |
          find /home/runner/work/CrossMix-OS/CrossMix-OS -type f -name ".gitkeep" -delete
          rm -rf /home/runner/work/CrossMix-OS/CrossMix-OS/_assets
          rm /home/runner/work/CrossMix-OS/CrossMix-OS/LICENSE
          rm /home/runner/work/CrossMix-OS/CrossMix-OS/README.md
          ls -la /home/runner/work/CrossMix-OS/CrossMix-OS
          rm -rf /home/runner/work/CrossMix-OS/CrossMix-OS/.git
          rm -rf /home/runner/work/CrossMix-OS/CrossMix-OS/.github
          ls -la /home/runner/work/CrossMix-OS/CrossMix-OS
          cd /home/runner/work/CrossMix-OS/CrossMix-OS
          echo "$BUILD_VERSION" > System/usr/trimui/crossmix-version.txt
          /usr/local/bin/7zz a RetroArch/default_config.7z RetroArch/retroarch.cfg RetroArch/.retroarch/config/*
      - name: Packaging release (7z; auto-split if over GitHub 2 GiB asset limit)
        run: |
          shopt -s dotglob
          cd /home/runner/work/CrossMix-OS/CrossMix-OS
          7zz a -mx=7 "/home/runner/work/CrossMix-OS/CrossMix-OS_v${{ env.BUILD_VERSION }}.7z" ./*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /home/runner/work/CrossMix-OS
          ASSET="CrossMix-OS_v${{ env.BUILD_VERSION }}.7z"
          SIZE=$(stat -c%s "$ASSET" 2>/dev/null || echo 0)
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "Single archive is $SIZE bytes; rebuilding as 1900 MB split volumes (GitHub 2 GiB asset limit)."
            rm -f "$ASSET"*
            ( shopt -s dotglob; cd CrossMix-OS && 7zz a -mx=7 -v1900m "../$ASSET" ./* )
          fi
          # Drop any draft left over from a previous failed run on this tag
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "CrossMix-OS CE v${{ env.BUILD_VERSION }}" \
            --notes "Community Edition baseline. Original work by cizia64 and contributors (GPL-3.0). If the download comes in parts (.7z.001, .7z.002, ...), download all of them into the same folder and extract with: 7z x CrossMix-OS_v${{ env.BUILD_VERSION }}.7z.001" \
            --draft CrossMix-OS_v${{ env.BUILD_VERSION }}.7z*
