name: CrossMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    tags:
      - v*

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Get version
        run: |
          TAG="${{ github.ref_name }}"
          echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          # Physical git size of the tagged tree, for the manifest's separate byte accounting.
          GIT_BYTES=$(git ls-tree -r -l HEAD | awk '{s+=$4} END {printf "%.0f", s}')
          echo "GIT_OBJECT_BYTES=${GIT_BYTES}" >> $GITHUB_ENV
          # The workflow file is deleted by the cleaning step, so its hash is captured here.
          WF_SHA=$(sha256sum '.github/workflows/CrossMix Release.yml' | cut -d' ' -f1)
          echo "WORKFLOW_SHA256=${WF_SHA}" >> $GITHUB_ENV
      - name: Install 7-Zip
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          wget https://www.7-zip.org/a/7z2501-linux-x64.tar.xz -P "$RUNNER_TEMP/tools"
          tar xvf "$RUNNER_TEMP/tools/7z2501-linux-x64.tar.xz" -C "$RUNNER_TEMP/tools"
          sudo cp "$RUNNER_TEMP/tools/7zz" /usr/local/bin/
      - name: Record pre-transform inputs
        run: |
          # The generator uses 7zz above (if present) to count archive members; it never extracts.
          mkdir -p "$RUNNER_TEMP/manifests"
          cp .github/scripts/release-manifest.sh "$RUNNER_TEMP/manifests/release-manifest.sh"
          sh "$RUNNER_TEMP/manifests/release-manifest.sh" \
            --tree "$GITHUB_WORKSPACE" \
            --record-inputs "$RUNNER_TEMP/manifests/inputs.tsv"
      - name: Extract RetroArch cores
        run: |
          find "$GITHUB_WORKSPACE/RetroArch/.retroarch/cores" -name "*.7z" -execdir 7zz x {} \; -execdir rm {} \;
      - name: Validate firmware payload consistency
        run: |
          cd "$GITHUB_WORKSPACE"
          REQ_V=$(sed -n '1p' trimui/firmwares/MinFwVersion.txt | tr -d '\r')
          REQ_R=$(sed -n '2p' trimui/firmwares/MinFwVersion.txt | tr -d '\r')
          F="trimui/firmwares/firmware_tsp_v${REQ_V}_${REQ_R}.7z.001"
          if [ ! -f "$F" ]; then
            echo "::error::MinFwVersion.txt declares ${REQ_V}/${REQ_R} but $F is missing"
            exit 1
          fi
          echo "Firmware payload OK: $F"
      - name: Generate hotfix surface manifest
        run: |
          # Hotfix payloads live under _assets, which the cleaning step deletes: record them now.
          # A hotfix is its own surface; it is not an image and must not be reported as one.
          if [ -d _assets/hotfixes ]; then
            sh "$RUNNER_TEMP/manifests/release-manifest.sh" \
              --tree "$GITHUB_WORKSPACE" \
              --version "$BUILD_VERSION" \
              --tag "$GITHUB_REF_NAME" \
              --surface hotfix \
              --include _assets/hotfixes \
              --commit "$GIT_COMMIT" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow ".github/workflows/CrossMix Release.yml" \
              --workflow-sha256 "$WORKFLOW_SHA256" \
              --ref "$GITHUB_REF" \
              --run-id "$GITHUB_RUN_ID" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --output "$RUNNER_TEMP/manifests/CrossMix-OS_v${BUILD_VERSION}.hotfix-manifest.json"
          else
            echo "::warning::no _assets/hotfixes directory: hotfix manifest not generated"
          fi
      - name: Cleaning image...
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -type f -name ".gitkeep" -delete
          rm -rf _assets
          rm LICENSE
          rm README.md
          ls -la
          rm -rf .git
          rm -rf .github
          ls -la
          # Version stamp: image must always carry its own version key
          echo "$BUILD_VERSION" > System/usr/trimui/crossmix-version.txt
          /usr/local/bin/7zz a RetroArch/default_config.7z RetroArch/retroarch.cfg RetroArch/.retroarch/config/*
      - name: Packaging release (7z; auto-split if over GitHub 2 GiB asset limit)
        run: |
          shopt -s dotglob
          OUT="$(dirname "$GITHUB_WORKSPACE")/CrossMix-OS_v${BUILD_VERSION}.7z"
          cd "$GITHUB_WORKSPACE"
          7zz a -mx=7 "$OUT" ./*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          ASSET="CrossMix-OS_v${BUILD_VERSION}.7z"
          SIZE=$(stat -c%s "$ASSET" 2>/dev/null || echo 0)
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "Single archive is $SIZE bytes; rebuilding as 1900 MB split volumes (GitHub 2 GiB asset limit)."
            rm -f "$ASSET"*
            ( shopt -s dotglob; cd "$GITHUB_WORKSPACE" && 7zz a -mx=7 -v1900m "../$ASSET" ./* )
          fi
          # Recreate the release for this tag (drops stale drafts/assets on rebuild)
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "CrossMix-OS SE v${BUILD_VERSION}" \
            --notes "Scorpio Edition. Based on CrossMix-OS by cizia64 and contributors (GPL-3.0). Fresh installs: download the image and extract to the SD root. Existing installs: updates arrive as small hotfixes via Check Update; the full image is only needed for a clean install." \
            --draft "$ASSET"*
      - name: Publish release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The manifest is generated after the archive exists so it hashes what was actually
          # built (including split volumes), then attached next to it. Archive names are untouched.
          MANIFEST="$RUNNER_TEMP/manifests/CrossMix-OS_v${BUILD_VERSION}.manifest.json"
          cd "$(dirname "$GITHUB_WORKSPACE")"
          ARGS=()
          for f in "CrossMix-OS_v${BUILD_VERSION}.7z"*; do
            [ -f "$f" ] || continue
            ARGS+=(--artifact "$(pwd)/$f")
          done
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "::error::no CrossMix-OS_v${BUILD_VERSION}.7z* archive found next to the workspace"
            exit 1
          fi
          GB=()
          if [ -n "${GIT_OBJECT_BYTES:-}" ]; then GB=(--git-object-bytes "$GIT_OBJECT_BYTES"); fi
          sh "$RUNNER_TEMP/manifests/release-manifest.sh" \
            --tree "$GITHUB_WORKSPACE" \
            --version "$BUILD_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GIT_COMMIT" \
            --surface image \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/CrossMix Release.yml" \
            --workflow-sha256 "$WORKFLOW_SHA256" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${GB[@]}" \
            --inputs "$RUNNER_TEMP/manifests/inputs.tsv" \
            "${ARGS[@]}" \
            --output "$MANIFEST"
          jq -e . "$MANIFEST" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$MANIFEST" --clobber
      - name: Upload manifest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-v${{ env.BUILD_VERSION }}
          path: ${{ runner.temp }}/manifests/*.json
          if-no-files-found: warn
