name: CrossMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    tags:
      - v*

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Get version
        run: |
          TAG="${{ github.ref_name }}"
          echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV
      - name: Install 7-Zip
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          wget https://www.7-zip.org/a/7z2501-linux-x64.tar.xz -P "$RUNNER_TEMP/tools"
          tar xvf "$RUNNER_TEMP/tools/7z2501-linux-x64.tar.xz" -C "$RUNNER_TEMP/tools"
          sudo cp "$RUNNER_TEMP/tools/7zz" /usr/local/bin/
      - name: Extract RetroArch cores
        run: |
          find "$GITHUB_WORKSPACE/RetroArch/.retroarch/cores" -name "*.7z" -execdir 7zz x {} \; -execdir rm {} \;
      - name: Validate firmware payload consistency
        run: |
          cd "$GITHUB_WORKSPACE"
          REQ_V=$(sed -n '1p' trimui/firmwares/MinFwVersion.txt | tr -d '\r')
          REQ_R=$(sed -n '2p' trimui/firmwares/MinFwVersion.txt | tr -d '\r')
          F="trimui/firmwares/firmware_tsp_v${REQ_V}_${REQ_R}.7z.001"
          if [ ! -f "$F" ]; then
            echo "::error::MinFwVersion.txt declares ${REQ_V}/${REQ_R} but $F is missing"
            exit 1
          fi
          echo "Firmware payload OK: $F"
      - name: Cleaning image...
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -type f -name ".gitkeep" -delete
          rm -rf _assets
          rm LICENSE
          rm README.md
          ls -la
          rm -rf .git
          rm -rf .github
          ls -la
          # Version stamp: image must always carry its own version key
          echo "$BUILD_VERSION" > System/usr/trimui/crossmix-version.txt
          /usr/local/bin/7zz a RetroArch/default_config.7z RetroArch/retroarch.cfg RetroArch/.retroarch/config/*
      - name: Packaging release (7z; auto-split if over GitHub 2 GiB asset limit)
        run: |
          shopt -s dotglob
          OUT="$(dirname "$GITHUB_WORKSPACE")/CrossMix-OS_v${BUILD_VERSION}.7z"
          cd "$GITHUB_WORKSPACE"
          7zz a -mx=7 "$OUT" ./*
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          ASSET="CrossMix-OS_v${BUILD_VERSION}.7z"
          SIZE=$(stat -c%s "$ASSET" 2>/dev/null || echo 0)
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "Single archive is $SIZE bytes; rebuilding as 1900 MB split volumes (GitHub 2 GiB asset limit)."
            rm -f "$ASSET"*
            ( shopt -s dotglob; cd "$GITHUB_WORKSPACE" && 7zz a -mx=7 -v1900m "../$ASSET" ./* )
          fi
          # Recreate the release for this tag (drops stale drafts/assets on rebuild)
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "CrossMix-OS SE v${BUILD_VERSION}" \
            --notes "Scorpio Edition. Based on CrossMix-OS by cizia64 and contributors (GPL-3.0). Fresh installs: download the image and extract to the SD root. Existing installs: updates arrive as small hotfixes via Check Update; the full image is only needed for a clean install." \
            --draft "$ASSET"*
